<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APT Threat Map – CTI · Detecção · Defesa · Resposta</title>
<style>
:root{--bg:#090d15;--panel:#101724;--panel2:#162035;--panel3:#1b2740;--line:#233150;--txt:#dbe4f3;--mut:#8a98b3;--acc:#4da3ff;--acc2:#7c5cff;--ok:#2ecc8f;--warn:#ffb347;--bad:#ff5d6c;--vio:#c084fc}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:13.5px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);z-index:99;font-size:15px;color:var(--mut)}
#loading .sp{width:42px;height:42px;border:3px solid #22304d;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
header{padding:16px 22px 10px;background:radial-gradient(1200px 300px at 10% -40%,#1a2d55 0,transparent 60%),linear-gradient(180deg,#0e1628,#090d15);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;letter-spacing:.3px}h1 span{color:var(--acc)}.sub{color:var(--mut);margin-top:3px;font-size:12.5px}
.kpis{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.kpi{background:rgba(16,23,36,.85);border:1px solid var(--line);border-radius:9px;padding:4px 10px;min-width:92px}
.kpi b{display:block;font-size:16px;color:#fff}.kpi small{color:var(--mut);font-size:10.5px}
#fbar{position:sticky;top:0;z-index:30;background:rgba(12,18,30,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:8px 22px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#fbar .lbl{color:var(--mut);font-size:11.5px;margin-right:2px}
input,select,button,textarea{font:inherit}
input,select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12.5px;max-width:190px}
input[type=search]{min-width:230px}input[type=range]{padding:0;max-width:120px;accent-color:var(--acc)}input[type=checkbox]{accent-color:var(--acc)}
.btn{background:var(--panel3);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn.pri{background:linear-gradient(135deg,#1d4ed8,#6d28d9);border-color:#4058c8}.btn.sm{padding:2px 8px;font-size:11.5px}
.btn.on{border-color:var(--acc);color:#fff;background:#1d3156}
#fcount{margin-left:auto;color:var(--mut);font-size:12px}#fcount b{color:#fff}
nav{display:flex;gap:2px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:46px;z-index:29}
nav button{background:none;border:0;color:var(--mut);padding:10px 12px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--acc)}
main{padding:14px 22px}.tab{display:none}.tab.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.card h3{margin:0 0 8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.muted{color:var(--mut)}.note{color:var(--mut);font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin:1px 2px 1px 0;background:#1a2540;color:#b9c7e2;border:1px solid #2a3858;white-space:nowrap}
.tag.c{background:#0f2a40;border-color:#1f4d78;color:#9fd0ff}.tag.m{background:#22183d;border-color:#4a3590;color:#d0c2ff}.tag.d{background:#0f2e24;border-color:#1f6b52;color:#8ff0c8}
.tag.w{background:#3a2a10;border-color:#7a5720;color:#ffd38a}.tag.r{background:#3a1218;border-color:#7a2a34;color:#ffb3bc}.tag.cl{cursor:pointer}.tag.cl:hover{border-color:var(--acc)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:600}
.lv-high{background:#4a1520;color:#ff9aa6}.lv-medium{background:#4a3510;color:#ffcf7a}.lv-low,.lv-informational{background:#103a2a;color:#8ff0c8}.lv-critical{background:#6a0f1d;color:#fff}
.warn{background:#2f230e;border:1px solid #6b4d1c;color:#ffe0a8;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:12.5px}
.info{background:#0f2238;border:1px solid #1f4670;color:#cfe6ff;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:12.5px}
.gap{background:#2a1418;border:1px solid #5b2730;border-radius:8px;padding:8px 10px;color:#ffc4cb;font-size:12.5px}
.why{background:#10221c;border:1px solid #1f5a45;border-radius:8px;padding:8px 10px;color:#bff3dc;font-size:12.5px}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);color:var(--mut);font-weight:600;font-size:12px;position:sticky;top:88px;z-index:2;cursor:pointer;user-select:none}
tr.r:hover{background:#15203a;cursor:pointer}
pre{background:#060a12;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font:11.8px/1.45 Consolas,"Cascadia Code",monospace;color:#cfe3ff;max-height:380px;margin:4px 0 8px;white-space:pre-wrap;word-break:break-word}
.codehead{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:11.5px;margin-top:6px;gap:8px}
.ftabs{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}.ftabs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:3px 8px;font-size:11.5px;cursor:pointer}
.ftabs button.on{color:#fff;border-color:var(--acc);background:#16305a}.ftabs button.x{opacity:.45;text-decoration:line-through}
.bar{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:12px}.bar .l{width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{flex:1;background:#0c1220;border-radius:4px;height:12px;overflow:hidden}.bar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}.bar .n{width:46px;text-align:right;color:var(--mut)}
/* mapa */
.mapwrap{position:relative;display:grid;grid-template-columns:1fr 360px;gap:12px}
#mapbox{position:relative;background:radial-gradient(900px 500px at 50% 40%,#0f1a2e,#080c14);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:var(--ph,640px);min-height:480px}
#map{width:100%;height:100%;display:block;cursor:grab}
.sphere{fill:#0b1322;stroke:#1d2a44}.grat{fill:none;stroke:#18243b;stroke-width:.4}
.cty{stroke:#2a3a5c;stroke-width:.35;transition:fill .25s}.cty:hover{stroke:#9fd0ff;stroke-width:.9}.cty.sel{stroke:#fff;stroke-width:1.3}
.mks circle{cursor:pointer;opacity:.92}.mks circle.on{stroke:#fff!important;stroke-width:2px!important;opacity:1}.mks circle.dim{opacity:.18}
.arcs path{fill:none;opacity:.55;pointer-events:visibleStroke;cursor:pointer}.arcs path:hover{opacity:1}.arcs path.anim{stroke-dasharray:6 5;animation:dash 1.2s linear infinite;opacity:.95}
@keyframes dash{to{stroke-dashoffset:-22}}
.mapctl{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;background:rgba(10,15,26,.85);border:1px solid var(--line);border-radius:10px;padding:6px 8px;align-items:center;max-width:calc(100% - 20px)}
.mapctl label{font-size:11.5px;color:var(--mut);display:flex;gap:4px;align-items:center}
#mleg{position:absolute;left:10px;bottom:10px;background:rgba(10,15,26,.88);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--mut);max-width:520px}
#mleg .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px;vertical-align:-1px}
.zbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
#mside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;height:var(--ph,640px);min-height:480px;overflow:auto}
#mside h3{margin:0 0 6px;font-size:15px}.gl{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}.gl:hover{background:#17223a}
.gl .sc{color:var(--mut);font-size:11px;white-space:nowrap}
#tip{position:fixed;pointer-events:none;z-index:80;background:rgba(8,12,20,.96);border:1px solid #2f4268;border-radius:8px;padding:7px 9px;font-size:12px;max-width:340px;display:none;box-shadow:0 8px 24px #0009}
/* grafo */
.gwrap{display:grid;grid-template-columns:270px 1fr 330px;gap:12px}
.gctl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;height:var(--ph,640px);min-height:480px;overflow:auto;font-size:12.5px}
.gctl h4{margin:10px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--acc)}
.gctl label{display:flex;gap:6px;align-items:center;margin:2px 0;color:var(--txt)}.gctl .sw{width:18px;height:3px;border-radius:2px;display:inline-block}
.gctl .nd{width:10px;height:10px;border-radius:50%;display:inline-block}
#gbox{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(800px 500px at 50% 50%,#0f1a2e,#080c14);height:var(--ph,640px);min-height:480px}
#gcv{width:100%;height:100%;display:block}#gstat{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--mut)}
#ginfo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;height:var(--ph,640px);min-height:480px;overflow:auto}
/* traçagem */
.trbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#trwrap{position:relative;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
#trcols{position:relative;display:grid;grid-template-columns:150px 190px 250px 200px 220px 190px 230px;gap:26px;min-width:1520px;z-index:1}
#trsvg{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
.tcol{max-height:var(--ph,640px);overflow-y:auto;overflow-x:hidden;padding-right:4px;scrollbar-width:thin}.tcol h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--acc);display:flex;justify-content:space-between;position:sticky;top:0;background:var(--panel);z-index:2;padding:2px 0}
.ti{position:relative;background:var(--panel2);border:1px solid var(--line);border-left:3px solid #33476d;border-radius:6px;padding:3px 6px;margin:0 0 4px;font-size:11.5px;cursor:pointer;line-height:1.3}
.ti:hover,.ti.hl{border-color:var(--acc);background:#1a2c4d}.ti.sel{outline:1px solid #fff}.ti.dim{opacity:.28}
.ti small{color:var(--mut);display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ti .c{float:right;color:var(--mut);font-size:10px;margin-left:4px}
.tacsep{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 3px;border-bottom:1px dashed #2a3858}
#trsvg path{fill:none;stroke:#5b7fc4;stroke-opacity:.16;stroke-width:1}#trsvg path.hl{stroke:#7fc0ff;stroke-opacity:.85;stroke-width:1.6}#trsvg path.r{display:none}#trsvg path.r.hl{display:inline}
#trdet{margin-top:12px}
/* modal / drawer */
#drawer{position:fixed;top:0;right:-100%;width:min(940px,97vw);height:100vh;background:#0d1320;border-left:1px solid var(--line);z-index:60;overflow:auto;transition:right .25s;box-shadow:-20px 0 40px #000a}
#drawer.on{right:0}.dhd{position:sticky;top:0;background:#0d1320;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:3}
.dbd{padding:12px 18px}.sec{margin:12px 0}.sec h4{margin:0 0 6px;color:var(--acc);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
#modal{position:fixed;inset:0;background:rgba(3,6,12,.72);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#modal.on{display:flex}#modal .mbox{background:#0d1320;border:1px solid var(--line);border-radius:14px;width:min(1080px,98vw);box-shadow:0 30px 60px #000c}
.mhd{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d1320;border-radius:14px 14px 0 0;z-index:2}
.mbd{padding:12px 18px}
.stabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:10px}.stabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:7px 10px;cursor:pointer;font-size:12.5px}
.stabs button.on{color:#fff;border-color:var(--acc)}
.d3t{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--mut)}.chip.on{background:#16305a;border-color:var(--acc);color:#fff}
.stat{display:inline-block;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700}.st-ok{background:#0f3b2a;color:#7ff0bf}.st-pa{background:#3d2f0f;color:#ffd38a}.st-gap{background:#45141c;color:#ff9aa6}
.matrix{display:grid;grid-template-columns:repeat(15,minmax(92px,1fr));gap:4px;font-size:10.5px;overflow-x:auto}
.matrix h5{margin:0 0 4px;font-size:10px;color:var(--mut);height:28px;overflow:hidden;text-transform:uppercase}
.mc{border-radius:4px;padding:3px 4px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#e6eeff;border:1px solid transparent}
.mc.cov-ok{border-left:3px solid var(--ok)}.mc.cov-pa{border-left:3px solid var(--warn)}.mc.cov-gap{border-left:3px solid var(--bad)}
footer{padding:16px 22px;color:var(--mut);font-size:11.5px;border-top:1px solid var(--line)}
@media(max-width:1200px){.mapwrap,.gwrap{grid-template-columns:1fr}#mside,#ginfo,.gctl{height:auto;max-height:none}}
</style>
</head>
