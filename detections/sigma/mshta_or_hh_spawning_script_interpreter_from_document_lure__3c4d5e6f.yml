title: MSHTA Or HH Spawning Script Interpreter From Document Lure
id: 3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e08
status: experimental
description: mshta.exe or hh.exe (CHM) spawning powershell/cmd/wscript - common Kimsuky execution chain from LNK/CHM lures.
author: CTI Consolidation
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1218.005
    - attack.t1218.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith:
            - '\mshta.exe'
            - '\hh.exe'
        Image|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\curl.exe'
    condition: selection
falsepositives:
    - Aplicações legadas HTA internas
level: high
