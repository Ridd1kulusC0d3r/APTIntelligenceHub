title: Local Account Created And Added To Administrators Via Net Command
id: 1e2f3a4b-5c6d-4e7f-8a9b-0c1d2e3f4a15
status: experimental
description: net user /add followed by localgroup administrators /add - persistence observed after APT35 ProxyShell exploitation.
author: CTI Consolidation
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_add:
        CommandLine|contains|all:
            - 'localgroup'
            - 'admin'
            - '/add'
    condition: all of selection_*
falsepositives:
    - Scripts de provisionamento de TI
level: medium
