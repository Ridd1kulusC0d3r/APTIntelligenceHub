title: Domain Federation Settings Modified In Entra ID
id: 4b5c6d7e-8f9a-4b0c-1d2e-3f4a5b6c7d18
status: experimental
description: Changes to domain federation/authentication used by Scattered Spider (and APT29) to add attacker-controlled IdP for persistence.
author: CTI Consolidation
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1484.002
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        OperationName:
            - 'Set domain authentication'
            - 'Set federation settings on domain'
            - 'Add unverified domain'
    condition: selection
falsepositives:
    - Projetos de migração de IdP
level: high
