title: Encoded PowerShell Spawned By Script Host
id: 2f3a4b5c-6d7e-4f8a-9b0c-1d2e3f4a5b16
status: experimental
description: wscript/cscript/mshta spawning powershell with -enc/-EncodedCommand - FIN7 JavaScript loader chains.
author: CTI Consolidation
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1059.007
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
    selection_child:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - ' -enc'
            - ' -EncodedCommand'
            - ' -e '
    condition: all of selection_*
falsepositives:
    - Scripts de login legados
level: high
