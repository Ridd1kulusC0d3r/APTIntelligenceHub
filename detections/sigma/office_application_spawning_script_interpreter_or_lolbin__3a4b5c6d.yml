title: Office Application Spawning Script Interpreter Or LOLBin
id: 3a4b5c6d-7e8f-4a9b-0c1d-2e3f4a5b6c17
status: stable
description: WINWORD/EXCEL spawning wscript/mshta/powershell - Gamaredon template-injection and macro chains.
author: CTI Consolidation
date: 2025-01-01
tags:
    - attack.execution
    - attack.t1204.002
    - attack.defense-evasion
    - attack.t1221
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\powershell.exe'
            - '\cmd.exe'
    condition: selection
falsepositives:
    - Add-ins corporativos legados
level: high
