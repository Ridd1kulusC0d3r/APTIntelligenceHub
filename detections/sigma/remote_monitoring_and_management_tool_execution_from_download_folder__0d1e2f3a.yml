title: Remote Monitoring And Management Tool Execution From Download Folder
id: 0d1e2f3a-4b5c-4d6e-7f8a-9b0c1d2e3f14
status: experimental
description: RMM agents (Atera, ScreenConnect, SimpleHelp, AnyDesk, Syncro, NetBird) launched from user Downloads/Temp - MuddyWater initial access pattern.
author: CTI Consolidation
date: 2025-01-01
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|contains:
            - 'AteraAgent'
            - 'ScreenConnect'
            - 'SimpleHelp'
            - 'AnyDesk'
            - 'Syncro'
            - 'netbird'
        - Product|contains:
            - 'Atera'
            - 'ScreenConnect'
            - 'SimpleHelp'
            - 'AnyDesk'
    selection_path:
        Image|contains:
            - '\Downloads\'
            - '\AppData\Local\Temp\'
    condition: all of selection_*
falsepositives:
    - Suporte técnico legítimo; manter allowlist das ferramentas RMM aprovadas
level: medium
