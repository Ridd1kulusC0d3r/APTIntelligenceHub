title: Scheduled Task Created With Executable In User-Writable Location
id: 5c6d7e8f-9a0b-4c1d-2e3f-4a5b6c7d8e19
status: experimental
description: schtasks /create pointing to AppData/ProgramData/Public - persistence used by APT32 and many other actors.
author: CTI Consolidation
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    selection_path:
        CommandLine|contains:
            - '\AppData\'
            - '\ProgramData\'
            - '\Users\Public\'
            - '%APPDATA%'
            - '%PROGRAMDATA%'
    condition: all of selection_*
falsepositives:
    - Atualizadores de software de usuário (Chrome/Teams) – allowlist por nome de tarefa
level: medium
