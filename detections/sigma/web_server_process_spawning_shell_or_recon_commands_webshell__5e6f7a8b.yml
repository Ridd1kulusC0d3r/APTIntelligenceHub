title: Web Server Process Spawning Shell Or Recon Commands (Webshell)
id: 5e6f7a8b-9c0d-4e1f-2a3b-4c5d6e7f8a09
status: experimental
description: IIS/Tomcat/Java worker processes spawning command interpreters or recon utilities - typical post-exploitation of public-facing apps by APT41, Volt Typhoon, HAFNIUM.
author: CTI Consolidation
date: 2025-01-01
tags:
    - attack.persistence
    - attack.t1505.003
    - attack.initial-access
    - attack.t1190
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\w3wp.exe'
            - '\tomcat.exe'
            - '\tomcat8.exe'
            - '\tomcat9.exe'
            - '\java.exe'
            - '\httpd.exe'
            - '\nginx.exe'
            - '\UMWorkerProcess.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\whoami.exe'
            - '\net.exe'
            - '\net1.exe'
            - '\nltest.exe'
            - '\certutil.exe'
            - '\rundll32.exe'
    condition: all of selection_*
falsepositives:
    - Aplicações Java que executam scripts de manutenção (baseline por servidor)
level: high
